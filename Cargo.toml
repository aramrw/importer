[package]
name = "importer"
version = "0.0.1"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["rc"] }
serde_json = "1.0"
thiserror = "=2.0.12"
zip = "2.1.3"
tempfile = "3.10.1"
chrono = { version = "=0.4.38", features = ["serde"] }
rayon = { version =  "1.10.0", optional = true }
serde-untagged = "=0.1.6"
uuid = { version = "=1.10.0", features = ["v4", "v7", "fast-rng"] }
bimap = { version = "=0.6.3", features = ["std"] }
# unicode-segmentation = "=1.12.0"
# unicode-normalization = "=0.1.24"
derive_more = { version = "1.0.0", features = ["debug", "from", "deref", "deref_mut"] }
indexmap = { version = "2.7.1", features = ["serde"] }
# deinflector = { path = "../deinflector" }
# icu = "=2.0.0"
fancy-regex = "=0.14.0"
getset = "=0.1.6"
serde_with = "=3.13.0"
url = "=2.5.4"
rmp-serde = "=1.3.0"
rmpv = { version = "=1.3.0", features = ["with-serde"] }
better_default = "=1.0.5"
parking_lot = { version = "0.12.4", features = ["arc_lock", "serde", "send_guard"] }
# derive-where = { version = "1.5.0", features = ["serde"] }
derivative = { version = "2.2.0", features = ["use_core"] }
anki_direct = { path = "../anki_direct", features = ["cache"] }
compact_str = { version = "0.9", features = ["serde"] }
tracing = { version = "0.1.41", optional = true }
simd-json = { version = "0.15.1", optional = true }
memchr = { version = "2.7", optional = true }
tracing-subscriber = "0.3.19"

[target.'cfg(unix)'.dependencies]
pprof = { version = "0.13", features = ["flamegraph"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tracing = { version = "0.1.41" }
tracing-subscriber = "0.3.19"

[features]
default = []
simd = ["dep:simd-json", "dep:memchr"]
rayon = ["dep:rayon"]
trace = ["dep:tracing"]
full = ["simd", "rayon", "trace"]
